name: Unit Tests & Code Lint

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  run-tests:
    runs-on: ubuntu-latest  # 使用 GitHub 免费的高性能 Linux 虚拟机秒级运行测试

    steps:
    - name: 检出提交代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装测试框架
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff

    - name: 自动化静态语法检查
      run: |
        # 扫描是否有拼写错误、无效引用
        ruff check .

    - name: 自动化运行单元测试
      run: |
        # 自动执行 tests/ 下的所有测试用例
        pytest tests/
